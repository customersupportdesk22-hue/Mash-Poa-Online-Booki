<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3221c">
  <meta name="description" content="Mash Poa official online bus booking. Search routes, choose your seat and pay securely online.">
  <title>Mash Poa – Official Online Bus Booking Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">

<body>
  <div class="topbar"><div class="wrap"><span>Official Mash Poa online booking</span><a href="/chat.html">Live chat support</a></div></div>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/" data-link aria-label="Mash Poa home">
        <img src="/logo.png" alt="Mash Poa">

      <div class="header-actions">
        <a class="btn sm" href="/chat.html">Help</a>

      <a href="/chat.html">Live chat support</a>

    </div>

  <script src="/chat-widget.js" defer></script>
  <script src="/app.js" defer></script>
