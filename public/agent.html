<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mash Poa | Live Support</title><style>
:root{--f:#102d26;--l:#c7e36b}*{box-sizing:border-box}body{margin:0;background:#f4f6f1;font:14px system-ui,sans-serif;color:#17231f}header{background:var(--f);color:#fff;padding:16px;font-weight:800}#login{padding:24px;max-width:420px;margin:50px auto;background:#fff;border-radius:14px}input,textarea{padding:12px;border:1px solid #dce3da;border-radius:8px;font:inherit}button{padding:11px 14px;border:0;border-radius:8px;background:var(--f);color:#fff;font-weight:700}main{height:calc(100dvh - 54px);display:none}#list{width:310px;overflow:auto;background:#fff;border-right:1px solid #e2e8df}.chatitem{padding:14px;border-bottom:1px solid #edf0eb;cursor:pointer}.chatitem.active{background:#edf3e6}.chatitem small{display:block;color:#6d796f;margin-top:5px}#thread{flex:1;display:flex;flex-direction:column;min-width:0}#title{padding:14px;background:#fff;border-bottom:1px solid #e2e8df;font-weight:700}#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:78%;white-space:pre-wrap;background:#fff;border:1px solid #e5e9e2;border-radius:12px;padding:11px}.bubble.agent{align-self:flex-end;background:var(--f);color:#fff}.bubble small{display:block;font-size:10px;opacity:.7;margin-top:6px}#actions,#compose{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e5e9e2;flex-wrap:wrap}#compose textarea{flex:1;min-width:100px;max-height:100px}#notice{color:#b45309;padding:6px 12px}@media(max-width:650px){main{position:relative}#list{width:100%}#thread{display:none}main.open #list{display:none}main.open #thread{display:flex}#back{display:inline-block!important}}
</style></head><body><header> MASH POA · LIVE BOOKING SUPPORT <a href="/admin.html" style="float:right;color:#c7e36b">Admin settings</a></header><section id="login"><h2>Agent sign in</h2><input id="pw" type="password" placeholder="Agent password" style="width:100%"><button id="sign" style="margin-top:10px">Connect</button><p id="err"></p></section><main id="main"><aside id="list"></aside><section id="thread"><div id="title"><button id="back" style="display:none">←</button> Select a customer conversation</div><div id="messages"></div><div id="notice"></div><div id="actions"><input id="amount" type="number" placeholder="Amount KES" style="width:120px"><button id="sendPay">Send global payment details</button><button id="paid">Verify payment & issue ticket</button></div><div id="compose"><textarea id="reply" rows="2" placeholder="Reply to customer..."></textarea><button id="send">Send</button></div></section></main><script src="/socket.io/socket.io.js"></script><script>
let sock,items={},current=null;
const $=id=>document.getElementById(id);
$('sign').onclick=()=>{sock=io('/agent',{auth:{password:$('pw').value}});sock.on('connect',()=>{$('login').style.display='none';$('main').style.display='flex'});sock.on('connect_error',e=>$('err').textContent=e.message);sock.on('chats',a=>{a.forEach(c=>items[c._id]=c);renderList()});sock.on('chat:update',c=>{items[c._id]=c;renderList();if(current===c._id)show()});sock.on('agent:error',m=>$('notice').textContent=m);};
function renderList(){$('list').innerHTML=Object.values(items).sort((a,b)=>b.updatedAt-a.updatedAt).map(c=>'<div class="chatitem '+(current===c._id?'active':'')+'" data-id="'+c._id+'"><b>'+esc(c.name||'Guest')+'</b> '+(c.unread?'<b>('+c.unread+')</b>':'')+'<small>'+esc(c.phone)+' · '+esc(c.bookingRef||'New enquiry')+'</small></div>').join('')||'<p style="padding:18px">No customer chats yet.</p>';document.querySelectorAll('.chatitem').forEach(x=>x.onclick=()=>select(x.dataset.id))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function select(id){current=id;$('main').classList.add('open');$('title').innerHTML='<button id="back">←</button> '+esc(items[id].name)+' · '+esc(items[id].phone);$('title').querySelector('button').onclick=()=>$('main').classList.remove('open');sock.emit('chat:read',id);show();renderList()}
function show(){const c=items[current];if(!c)return;$('messages').innerHTML=c.messages.map(m=>'<div class="bubble '+(m.from==='agent'?'agent':'')+'">'+esc(m.text|| (m.type==='payment'?'Payment instructions sent':m.type==='ticket'?'Ticket '+m.ticket.ticketNo:''))+(m.type==='payment'&&m.payment?'<small>'+esc(m.payment.type)+' '+esc(m.payment.number)+' · KES '+esc(m.payment.amount)+'</small>':'')+(m.type==='ticket'&&m.ticket?'<small>'+esc(m.ticket.from)+' → '+esc(m.ticket.to)+' · '+esc((m.ticket.seats||[]).join(', '))+'</small>':'')+'</div>').join('');$('messages').scrollTop=$('messages').scrollHeight}
$('send').onclick=()=>{const t=$('reply').value.trim();if(t&&current){sock.emit('agent:reply',{chatId:current,text:t});$('reply').value=''}};$('reply').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};
$('sendPay').onclick=()=>{if(current)sock.emit('agent:payment',{chatId:current,amount:Number($('amount').value)||0})};
$('paid').onclick=()=>{if(!current)return;const ref=items[current].bookingRef;if(!ref)return alert('This chat has no booking reference.');if(confirm('Have you verified the payment for '+ref?'))sock.emit('agent:paid',{chatId:current,ref})};
</script></body></html>
