<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#131a2a">
  <title>Live chat – Mash Poa</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="chat-page">
  <div class="capp" id="capp">
    <header class="chead">
      <a class="cback" href="/" aria-label="Back to booking">‹</a>
      <img class="cav" src="/logo.png" alt="Mash Poa">
      <div class="ctitle"><b>Mash Poa Support</b><small id="status">Booking help · Chat with our team</small></div>
    </header>

    <div class="csum" id="summary" hidden></div>

    <main class="cmsgs" id="msgs" aria-live="polite">
      <div class="m in" id="greet"><span class="mt">Karibu! Enter your name and phone number below to start a booking support conversation.</span><span class="mm">Mash Poa</span></div>
    </main>

    <form id="ident" class="cident">
      <input class="in" id="name" placeholder="Your name" autocomplete="name" enterkeyhint="next">
      <input class="in" id="phone" placeholder="Phone, e.g. +254712345678" inputmode="tel" autocomplete="tel" enterkeyhint="go">
      <button class="btn block" type="submit">Start conversation</button>
      <div class="err" id="identErr"></div>
    </form>

    <form id="send" class="csend" hidden>
      <input class="in" id="text" placeholder="Type a message…" autocomplete="off" enterkeyhint="send">
      <button class="sendbtn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
      </button>
    </form>
  </div>

  <script>window.MashPoaChat = true;</script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const ksh = n => "Ksh " + Number(n || 0).toLocaleString("en-KE");
    const logo = '<img class="card-logo" src="/logo.png" alt="Mash Poa">';
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const clock = t => new Date(t || Date.now()).toLocaleTimeString("en-KE", { hour: "2-digit", minute: "2-digit", hour12: false });
    const dayLabel = t => { const d = new Date(t), n = new Date(), y = new Date(n - 864e5); const same = (a, b) => a.toDateString() === b.toDateString(); return same(d, n) ? "Today" : same(d, y) ? "Yesterday" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
    const TICK = '<svg viewBox="0 0 18 12" width="16" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6.5 4.5 10 11 2"/><path d="M7 9.5 8 10 15 2"/></svg>';
    const ONE = '<svg viewBox="0 0 18 12" width="16" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 6.5 10 14 2"/></svg>';

    const msgs = $("msgs");
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("mp_booking")); } catch {}
    const legs = saved ? (saved.bookings || (saved.ref ? [saved] : [])) : [];
    let socket = null, chatId = null, lastDay = "";
    const byCid = new Map(), byId = new Map();

    /* ---- keep the typing box above the keyboard ---- */
    const app = $("capp");
    const fit = () => {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      app.style.height = h + "px";
      window.scrollTo(0, 0);
      msgs.scrollTop = msgs.scrollHeight;
    };
    if (window.visualViewport) { visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit); }
    window.addEventListener("resize", fit);
    fit();
    const toEnd = () => { msgs.scrollTop = msgs.scrollHeight; };

    let enq = null;
    try { enq = JSON.parse(sessionStorage.getItem("mp_enquiry")); } catch {}
    try { const k = JSON.parse(localStorage.getItem("mp_contact")); if (k) { if (!$("name").value) $("name").value = k.name || ""; if (!$("phone").value) $("phone").value = k.phone || ""; } } catch {}
    const longD = d => { try { return new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }); } catch { return d; } };
    /* ---- booking summary: open by default, folds away while typing ---- */
    let sumOpen = true;
    function setSum(open) {
      sumOpen = open;
      const full = $("sumfull"), bar = $("sumbar");
      if (!full) return;
      full.hidden = !open; bar.hidden = open;
      setTimeout(fit, 0);
    }
    if (!legs.length && enq) {
      const s = $("summary"); s.hidden = false;
      const when = longD(enq.date) + (enq.round && enq.ret ? " · returning " + longD(enq.ret) : "");
      s.innerHTML =
        '<div class="sumfull" id="sumfull"><div class="sum-top">' + logo + '<span class="pill">Trip request</span></div>' +
        '<div class="sum-line"><b>' + esc(enq.from) + " → " + esc(enq.to) + '</b><span>' + esc(when) + '</span></div>' +
        '<p class="hint">This trip is not listed online yet. Chat with us and we will arrange your booking.</p>' +
        '<button type="button" class="sumhide" id="sumhide">Hide details ⌃</button></div>' +
        '<button type="button" class="sumbar" id="sumbar" hidden><span>' + logo + '</span><span class="sumtxt"><b>Trip request</b><small>' + esc(enq.from) + " → " + esc(enq.to) + '</small></span><i>⌄</i></button>';
      $("sumhide").onclick = () => setSum(false);
      $("sumbar").onclick = () => setSum(true);
    }
    if (legs.length) {
      const total = legs.reduce((n, l) => n + Number(l.amount || 0), 0), s = $("summary");
      s.hidden = false;
      s.innerHTML =
        '<div class="sumfull" id="sumfull">' +
          '<div class="sum-top">' + logo + '<span class="pill">Booking received</span></div>' +
          legs.map((l, i) => '<div class="sum-line"><b>' + (legs.length > 1 ? (i ? "Return" : "Outbound") + " · " : "") + esc(l.from) + " → " + esc(l.to) + '</b><span>' + esc(l.date) + " · " + esc(l.time) + " · Seat " + esc((l.seats || []).join(", ")) + '</span><small>Ref ' + esc(l.ref) + " · " + ksh(l.amount) + '</small></div>').join("") +
          '<div class="sum-total"><span>Total to pay</span><b>' + ksh(total) + '</b></div>' +
          '<p class="hint">An agent will send official payment details here. We never ask for your M-PESA PIN.</p>' +
          '<button type="button" class="sumhide" id="sumhide">Hide details ⌃</button>' +
        '</div>' +
        '<button type="button" class="sumbar" id="sumbar" hidden><span>' + logo + '</span><span class="sumtxt"><b>Booking received · ' + ksh(total) + '</b><small>' + legs.map(l => esc(l.from) + " → " + esc(l.to)).join(" · ") + '</small></span><i>⌄</i></button>';
      $("sumhide").onclick = () => setSum(false);
      $("sumbar").onclick = () => setSum(true);
      $("name").value = saved.name || "";
      $("phone").value = saved.phone || "";
    }

    function dayDivider(t) {
      const d = dayLabel(t);
      if (d === lastDay) return;
      lastDay = d;
      const el = document.createElement("div"); el.className = "dday"; el.textContent = d; msgs.appendChild(el);
    }
    const stateHtml = m => {
      if (m.from !== "customer") return "";
      if (m.pending) return '<span class="st">Sending…</span>';
      return m.status === "seen" ? '<span class="st seen">' + TICK + ' Seen</span>' : '<span class="st">' + TICK + ' Delivered</span>';
    };
    function paint(el, m) {
      let body;
      if (m.deleted) {
        el.classList.add("gone");
        el.innerHTML = '<span class="mt">🚫 This message was deleted</span><span class="mm">' + clock(m.at) + '</span>';
        return;
      }
      if (m.type === "payment" && m.payment) {
        const p = m.payment;
        el.classList.add("card-msg");
        body = logo + '<h4>Official payment instructions</h4>' +
          '<div class="kv"><span>Pay via</span><b>' + esc(String(p.type || "").toUpperCase()) + '</b></div>' +
          '<div class="kv"><span>' + (p.type === "paybill" ? "Business number" : p.type === "till" ? "Till number" : p.type === "bank" ? "Account" : "Phone number") + '</span><b>' + esc(p.number) + '</b></div>' +
          (p.account ? '<div class="kv"><span>Account</span><b>' + esc(p.account) + '</b></div>' : "") +
          '<div class="kv"><span>Name</span><b>' + esc(p.accountName) + '</b></div>' +
          (p.bookingRef ? '<div class="kv"><span>Booking</span><b>' + esc(p.bookingRef) + '</b></div>' : "") +
          '<div class="kv amt"><span>Amount</span><b>' + ksh(p.amount) + '</b></div>';
      } else if (m.type === "ticket" && m.ticket) {
        const t = m.ticket;
        el.classList.add("card-msg", "ticket");
        body = logo + '<h4>Ticket ' + esc(t.ticketNo) + '</h4>' +
          '<div class="kv"><span>Route</span><b>' + esc(t.from) + " → " + esc(t.to) + '</b></div>' +
          '<div class="kv"><span>Departure</span><b>' + esc(t.date) + " " + esc(t.time) + '</b></div>' +
          '<div class="kv"><span>Seats</span><b>' + esc((t.seats || []).join(", ")) + '</b></div>' +
          '<div class="kv"><span>Passengers</span><b>' + esc((t.passengers || []).map(p => p.name).join(", ")) + '</b></div>' +
          '<div class="kv amt"><span>Paid</span><b>' + ksh(t.amount) + '</b></div>';
      } else if (m.type === "booking" && m.booking) {
        body = '<span class="mt">Booking request ' + esc(m.booking.ref) + '</span>';
      } else {
        body = '<span class="mt">' + esc(m.text || "") + '</span>';
      }
      const canDel = m.from === "customer" && !m.type && !m.pending && m.id;
      el.innerHTML = body + '<span class="mm">' + clock(m.at) + (m.from === "customer" ? " " + stateHtml(m) : "") + '</span>' + (canDel ? '<button type="button" class="mdel" data-id="' + esc(m.id) + '">Delete message</button>' : "");
    }
    function bubble(m, fromSocket) {
      if (m.id && byId.has(m.id)) return;
      if (m.cid && byCid.has(m.cid)) { const el = byCid.get(m.cid); Object.assign(m, { pending: false }); byId.set(m.id, { el, m }); paint(el, m); return; }
      dayDivider(m.at);
      const el = document.createElement("div");
      el.className = "m " + (m.from === "customer" ? "out" : "in");
      paint(el, m);
      msgs.appendChild(el);
      if (m.id) byId.set(m.id, { el, m });
      if (m.cid) byCid.set(m.cid, el);
      toEnd();
      if (fromSocket && m.from !== "customer") markSeen();
    }
    msgs.addEventListener("click", e => {
      const d = e.target.closest(".mdel");
      if (d) { if (confirm("Delete this message for everyone?")) socket.emit("customer:delete-message", { chatId, id: d.dataset.id }); return; }
      const b = e.target.closest(".m.out");
      msgs.querySelectorAll(".m.sel").forEach(x => { if (x !== b) x.classList.remove("sel"); });
      if (b && b.querySelector(".mdel")) b.classList.toggle("sel");
    });
    function markSeen() { if (socket && chatId && document.visibilityState === "visible") socket.emit("customer:seen", chatId); }
    document.addEventListener("visibilitychange", markSeen);

    function start() {
      const phone = $("phone").value.trim(), name = $("name").value.trim();
      if (phone.replace(/\D/g, "").length < 9) { $("identErr").textContent = "Enter a valid phone number."; return; }
      if (!window.io) { $("identErr").textContent = "Chat service is not ready. Please refresh this page."; return; }
      try { localStorage.setItem("mp_contact", JSON.stringify({ name, phone })); } catch {}
      $("identErr").textContent = ""; $("status").textContent = "Connecting…";
      socket = io();
      socket.on("connect", () => socket.emit("customer:start", { name, phone, bookingRef: legs[0] ? legs[0].ref : "" }));
      socket.on("connect_error", () => { $("status").textContent = "Connection problem. Retrying…"; });
      socket.on("chat:ready", d => {
        chatId = d.chatId;
        const g = $("greet"); if (g) g.remove(); msgs.querySelectorAll(".m,.dday").forEach(n => n.remove()); byId.clear(); lastDay = "";
        (d.messages || []).forEach(m => bubble(m, false));
        const sent = new Set((d.messages || []).filter(m => m.type === "booking").map(m => m.booking.ref));
        legs.forEach(l => { if (!sent.has(l.ref)) socket.emit("customer:booking", { chatId, ref: l.ref, from: l.from, to: l.to, date: l.date, time: l.time, seats: l.seats, amount: l.amount }); });
        $("ident").hidden = true; $("send").hidden = false; $("status").textContent = "Online · an agent will reply shortly";
        fit(); markSeen();
        const sig = enq ? [enq.from, enq.to, enq.date, enq.ret].join("|") : "";
        if (!legs.length && enq && sessionStorage.getItem("mp_enq_sent") !== sig) {
          sessionStorage.setItem("mp_enq_sent", sig);
          sendText("Hello Mash Poa, I would like to book a bus from " + enq.from + " to " + enq.to + " on " + longD(enq.date) + (enq.round && enq.ret ? ", returning on " + longD(enq.ret) : "") + ". I could not find this trip on the website. Please help me with the booking.");
        }
      });
      socket.on("message", m => bubble(m, true));
      socket.on("message:deleted", d => {
        const h = byId.get(d.id); if (!h) return;
        Object.keys(h.m).forEach(k => { if (!["id", "from", "at"].includes(k)) delete h.m[k]; });
        h.m.deleted = true; paint(h.el, h.m); h.el.classList.remove("sel", "out"); h.el.classList.add("gone", h.m.from === "customer" ? "out" : "in");
      });
      socket.on("chat:cleared", () => {
        msgs.querySelectorAll(".m,.dday").forEach(n => n.remove()); byId.clear(); byCid.clear(); lastDay = "";
        const n = document.createElement("div"); n.className = "dday"; n.textContent = "Chat cleared by Mash Poa support"; msgs.appendChild(n);
      });
      socket.on("status", d => {
        byId.forEach(({ el, m }) => { if (m.from === "customer" && m.status !== "seen") { m.status = "seen"; paint(el, m); } });
      });
    }
    $("ident").onsubmit = e => { e.preventDefault(); start(); };
    function sendText(text) {
      if (!text || !socket || !chatId) return;
      const cid = "c" + Date.now() + Math.random().toString(36).slice(2, 6);
      bubble({ from: "customer", text, at: Date.now(), pending: true, cid }, false);
      socket.emit("customer:message", { chatId, text, cid });
    }
    $("send").onsubmit = e => { e.preventDefault(); const text = $("text").value.trim(); if (!text) return; sendText(text); $("text").value = ""; $("text").focus(); };
    $("text").addEventListener("focus", () => { if (legs.length && sumOpen) setSum(false); setTimeout(() => { fit(); toEnd(); }, 250); });
    if (legs.length && $("phone").value) start();
  })();
  </script>
</body>
</html>
